title: Nuestra Historia
description: >-
  Todo comenzó en 2010 con un pequeño puesto en la esquina de Insurgentes,
  armados con una receta familiar y la pasión por los tacos auténticos.
  Hoy, Tacos Atarantados es sinónimo de calidad y sabor en toda la ciudad.


  Usamos las mejores tortillas hechas a mano, carnes seleccionadas y salsas
  artesanales preparadas cada día. Porque los buenos tacos no se improvisan:
  se perfeccionan.
