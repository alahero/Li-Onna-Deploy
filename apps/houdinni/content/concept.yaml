title: El Secreto Detrás del Telón
tagline: No todo lo que ves es real. No todo lo real es visible.
description: >-
  Houdinni es un speakeasy inspirado en el arte de la ilusión. Un lugar que
  desafía tus sentidos, donde cada detalle ha sido diseñado para transportarte
  a una realidad paralela donde la magia existe.

  Nuestros shows de ilusionismo en vivo, cócteles de autor y una atmósfera
  única crean una experiencia que va más allá de lo que puedes imaginar.
  Cada visita es diferente. Cada noche, un nuevo misterio.
