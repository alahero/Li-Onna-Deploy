question:
  name: "¿El festival es accesible para personas con discapacidad?"
  slug: accesibilidad
answer: >
  Sí. FUTUR Festival cuenta con accesos y áreas designadas para personas
  con discapacidad motriz. Si necesitas información sobre accesibilidad
  específica o asistencia especial, contáctanos en accesibilidad@futurfestival.mx
  con anticipación para coordinar tu visita.
order: 6
