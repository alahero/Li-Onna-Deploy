title: THE TEHMPLO EXPERIENCE
description: Nestled within the lush jungle of Tulum, Tehmplo is more than a nightclub — it is a sanctuary where ancient energy meets contemporary sound. Every night is a ceremony.
pillars:
  - title: Experience
    description: From the open-air architecture to the sacred cenote aesthetics, every detail of Tehmplo is crafted to transport you to something truly otherworldly. The jungle is the stage.
    icon: "✦"
  - title: Music
    description: Our curated program features the world's most respected selectors — from Berlin's underground to Ibiza's finest. Organic house, afro rhythms, and melodic techno fill the jungle air from dusk until dawn.
    icon: "◈"
  - title: Hospitality
    description: At Tehmplo, you are not just a guest — you are family. Our team of dedicated hosts ensures every visit is personal, memorable, and effortless. Excellence is not a policy; it is our nature.
    icon: "⟡"
