  # Eventos privados

  Cumpleaños, bodas, aniversarios. Celebraciones hechas a tu medida en los venues más exclusivos de Mandala Group.

  ## Qué incluye

  Privatización del venue. Menú personalizado. DJ o live entertainment. Coordinación completa.

  Cuéntanos tu visión y la hacemos realidad.
