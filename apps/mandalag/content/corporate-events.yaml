body: |
  # Eventos corporativos

  Desde activaciones de marca hasta lanzamientos de producto, Mandala Group produce eventos corporativos a la altura de las marcas más exigentes.

  ## Por qué Mandala

  Venues icónicos en México y Europa. Equipos de producción in-house. Gastronomía, mixología y entretenimiento bajo un mismo techo.

  ## Cómo trabajamos

  Discovery: entendemos tu marca y objetivos. Propuesta: concepto, venue, producción. Ejecución: el día del evento, tú solo disfrutas.

  Contáctanos para conversar sobre tu próximo evento.
